<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cup | Мой Профиль</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0e;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* ==========================================
           НАВИГАЦИЯ
        ========================================== */

        .nav-link {
            color: #8c8c9b;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
            display: inline-block;
            margin-bottom: 20px;
        }

        .nav-link:hover {
            color: #a67cff;
        }

        /* ==========================================
           ШАПКА
        ========================================== */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            font-weight: 900;
        }

        /* ==========================================
           КНОПКА ВЫХОДА
        ========================================== */

        .logout-btn {
            background: rgba(255, 60, 100, 0.1);
            color: #ff3c64;
            border: 1px solid rgba(255, 60, 100, 0.3);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #ff3c64;
            color: white;
        }

        /* ==========================================
           КАРТОЧКИ
        ========================================== */

        .profile-card {
            background: #141419;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #1f1f26;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #a67cff;
        }

        .info-row {
            font-size: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .steam-value {
            font-size: 24px;
            font-weight: bold;
            color: white;
            word-break: break-word;
        }

        /* ==========================================
           АВАТАР
        ========================================== */

        .avatar-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #25252d;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #a67cff;
            background: #0b0b0e;
            box-shadow: 0 0 25px rgba(166, 124, 255, 0.2);
        }

        .avatar-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .avatar-title {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .avatar-description {
            color: #8c8c9b;
            font-size: 13px;
        }

        .avatar-upload {
            display: inline-block;
            width: max-content;
            background: #23232b;
            border: 1px solid #33333d;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .avatar-upload:hover {
            background: #a67cff;
            border-color: #a67cff;
        }

        .avatar-upload input {
            display: none;
        }

        /* ==========================================
           КНОПКА STEAM
        ========================================== */

        .edit-btn {
            background: #a67cff;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 6px;
            width: max-content;
            transition: 0.2s;
        }

        .edit-btn:hover {
            background: #915eff;
            transform: translateY(-2px);
        }

        /* ==========================================
           RETRO CUP LEVEL
        ========================================== */

        .level-profile-section {
            margin-top: 28px;
            padding-top: 25px;
            border-top: 1px solid #25252d;
        }

        .level-main {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .level-circle {
            width: 92px;
            height: 92px;
            min-width: 92px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            background: #101014;

            font-size: 30px;
            font-weight: 900;

            border: 4px solid;

            transition:
                border-color 0.3s,
                color 0.3s,
                box-shadow 0.3s,
                transform 0.3s;
        }

        .level-circle:hover {
            transform: scale(1.04);
        }

        .level-circle::before {
            content: "";

            position: absolute;

            width: 68px;
            height: 68px;

            border-radius: 50%;

            background: #141419;

            z-index: 0;
        }

        .level-circle span {
            position: relative;
            z-index: 1;
        }

        /* LEVEL 1 */

        .level-1 {
            color: #b8b8c2;
            border-color: #777783;
            box-shadow: 0 0 20px rgba(150, 150, 160, 0.12);
        }

        /* LEVEL 2 */

        .level-2 {
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.18);
        }

        /* LEVEL 3 */

        .level-3 {
            color: #5aa9ff;
            border-color: #5aa9ff;
            box-shadow: 0 0 25px rgba(90, 169, 255, 0.22);
        }

        /* LEVEL 4 */

        .level-4 {
            color: #48e0ff;
            border-color: #48e0ff;
            box-shadow: 0 0 25px rgba(72, 224, 255, 0.25);
        }

        /* LEVEL 5 */

        .level-5 {
            color: #a67cff;
            border-color: #a67cff;
            box-shadow: 0 0 28px rgba(166, 124, 255, 0.28);
        }

        /* LEVEL 6 */

        .level-6 {
            color: #d16cff;
            border-color: #d16cff;
            box-shadow: 0 0 30px rgba(209, 108, 255, 0.3);
        }

        /* LEVEL 7 */

        .level-7 {
            color: #ff5c8a;
            border-color: #ff5c8a;
            box-shadow: 0 0 30px rgba(255, 92, 138, 0.3);
        }

        /* LEVEL 8 */

        .level-8 {
            color: #ff7a45;
            border-color: #ff7a45;
            box-shadow: 0 0 32px rgba(255, 122, 69, 0.32);
        }

        /* LEVEL 9 */

        .level-9 {
            color: #ffd84d;
            border-color: #ffd84d;
            box-shadow: 0 0 35px rgba(255, 216, 77, 0.35);
        }

        /* LEVEL 10 */

        .level-10 {
            color: #ffffff;
            border-color: #ffffff;
            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.4),
                0 0 45px rgba(166, 124, 255, 0.35);

            animation: level10Glow 2s infinite alternate;
        }

        @keyframes level10Glow {
            from {
                box-shadow:
                    0 0 20px rgba(255, 255, 255, 0.35),
                    0 0 40px rgba(166, 124, 255, 0.25);
            }

            to {
                box-shadow:
                    0 0 30px rgba(255, 255, 255, 0.6),
                    0 0 60px rgba(166, 124, 255, 0.45);
            }
        }

        /* ==========================================
           ИНФОРМАЦИЯ УРОВНЯ
        ========================================== */

        .level-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .level-title {
            color: white;
            font-size: 17px;
            font-weight: 900;
        }

        .level-pr {
            color: #a67cff;
            font-size: 21px;
            font-weight: 900;
        }

        .level-progress-text {
            color: #8c8c9b;
            font-size: 12px;
        }

        /* ==========================================
           ПРОГРЕСС
        ========================================== */

        .level-progress {
            width: 100%;
            height: 9px;

            background: #0b0b0e;

            border-radius: 20px;

            margin-top: 20px;

            overflow: hidden;

            border: 1px solid #292932;
        }

        .level-progress-fill {
            width: 0%;

            height: 100%;

            border-radius: 20px;

            background: #a67cff;

            box-shadow:
                0 0 12px rgba(166, 124, 255, 0.5);

            transition:
                width 0.7s ease,
                background 0.3s ease;
        }

        /* ==========================================
           СТАТИСТИКА
        ========================================== */

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;

            margin-top: 25px;
            padding-top: 20px;

            border-top: 1px solid #25252d;

            text-align: center;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 8px;

            background: #0c0c10;

            padding: 15px;

            border-radius: 8px;

            border: 1px solid #303039;
        }

        .stat-label {
            color: #8c8c9b;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .stat-val {
            color: white;
            font-size: 22px;
            font-weight: 900;
        }

        .stat-val.green {
            color: #00ffcc;
        }

        /* ==========================================
           МОДАЛЬНОЕ ОКНО
        ========================================== */

        .modal-overlay {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.8);

            backdrop-filter: blur(5px);

            z-index: 1000;

            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .modal-box {
            background: #141419;

            padding: 30px;

            border-radius: 12px;

            border: 1px solid #2a2a35;

            width: 90%;
            max-width: 350px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(166, 124, 255, 0.2);
        }

        .modal-box h3 {
            margin-top: 0;

            color: white;

            font-size: 20px;
        }

        .modal-description {
            color: #8c8c9b;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 15px;
        }

        .modal-input {
            width: 100%;

            padding: 12px;

            margin: 5px 0 15px 0;

            background: #0b0b0e;

            color: white;

            border: 1px solid #333;

            border-radius: 8px;

            font-size: 16px;

            text-align: center;
        }

        .modal-input:focus {
            outline: none;

            border-color: #a67cff;
        }

        .modal-buttons {
            display: flex;

            gap: 10px;
        }

        .btn-save {
            flex: 1;

            background: #a67cff;

            color: white;

            border: none;

            padding: 10px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }

        .btn-save:hover {
            background: #915eff;
        }

        .btn-save:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        .btn-cancel {
            flex: 1;

            background: transparent;

            color: #8c8c9b;

            border: 1px solid #333;

            padding: 10px;

            border-radius: 6px;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn-cancel:hover {
            background: #23232b;

            color: white;
        }

        /* ==========================================
           АДАПТИВ
        ========================================== */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            header {
                align-items: flex-start;
            }

            h1 {
                font-size: 23px;
            }

            .profile-card {
                padding: 20px;
            }

            .steam-value {
                font-size: 20px;
            }

            .avatar-wrapper {
                align-items: flex-start;
            }

            .profile-avatar {
                width: 75px;
                height: 75px;
            }

            .modal-box {
                padding: 25px 20px;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .level-main {
                gap: 15px;
            }

            .level-circle {
                width: 78px;
                height: 78px;
                min-width: 78px;
                font-size: 25px;
            }

            .level-circle::before {
                width: 57px;
                height: 57px;
            }

            .level-title {
                font-size: 15px;
            }

            .level-pr {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ==========================================
         НАВИГАЦИЯ
    ========================================== -->

    <a href="index.html" class="nav-link">
        ← Вернуться на главную
    </a>


    <!-- ==========================================
         ШАПКА
    ========================================== -->

    <header>

        <h1 id="welcome-text">
            Профиль
        </h1>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Выйти
        </button>

    </header>


    <!-- ==========================================
         КАРТОЧКА ПРОФИЛЯ
    ========================================== -->

    <div class="profile-card">

        <h2>
            Мой Аккаунт
        </h2>


        <!-- ======================================
             АВАТАР
        ======================================= -->

        <div class="avatar-wrapper">

            <img
                id="profile-avatar"
                class="profile-avatar"
                src="https://via.placeholder.com/150/141419/a67cff?text=TU"
                alt="Аватар"
            >

            <div class="avatar-info">

                <div class="avatar-title">
                    Моя аватарка
                </div>

                <div class="avatar-description">
                    JPG, PNG или GIF до 800 КБ
                </div>

                <label class="avatar-upload">

                    Изменить аватарку

                    <input
                        type="file"
                        accept="image/*"
                        onchange="uploadAvatar(event)"
                    >

                </label>

            </div>

        </div>


        <!-- ======================================
             STEAM ID
        ======================================= -->

        <div class="info-row">

            <span style="color: #8c8c9b; font-size: 14px;">
                Steam ID (Код дружбы):
            </span>

            <span
                id="display-steam"
                class="steam-value"
            >
                ⏳ Загрузка...
            </span>

            <button
                class="edit-btn"
                onclick="openModal()"
            >
                Изменить код
            </button>

        </div>


        <!-- ======================================
             RETRO CUP LEVEL
        ======================================= -->

        <div class="level-profile-section">

            <div class="level-main">

                <div
                    id="profile-level-circle"
                    class="level-circle level-1"
                >

                    <span id="profile-level">
                        1
                    </span>

                </div>


                <div class="level-info">

                    <div class="level-title">
                        Retro Cup Level
                    </div>

                    <div class="level-pr">
                        <span id="profile-pr">
                            1
                        </span>
                        PR
                    </div>

                    <div class="level-progress-text">

                        <span id="level-next-text">
                            До Level 2: 19 PR
                        </span>

                    </div>

                </div>

            </div>


            <div class="level-progress">

                <div
                    id="level-progress-bar"
                    class="level-progress-fill"
                ></div>

            </div>

        </div>


        <!-- ======================================
             ГЛОБАЛЬНАЯ СТАТИСТИКА
        ======================================= -->

        <div class="stats-container">

            <div class="stat-box">

                <span class="stat-label">
                    K/D Рейтинг
                </span>

                <span
                    class="stat-val green"
                    id="stat-kd"
                >
                    ⏳...
                </span>

            </div>


            <div class="stat-box">

                <span class="stat-label">
                    Винрейт
                </span>

                <span
                    class="stat-val"
                    id="stat-winrate"
                >
                    ⏳...
                </span>

            </div>


            <div class="stat-box">

                <span class="stat-label">
                    Матчи
                </span>

                <span
                    class="stat-val"
                    id="stat-matches"
                >
                    ⏳...
                </span>

            </div>

        </div>

    </div>

</div>


<!-- ==========================================
     МОДАЛЬНОЕ ОКНО STEAM ID
========================================== -->

<div
    id="steamModal"
    class="modal-overlay"
    onclick="handleModalBackground(event)"
>

    <div class="modal-box">

        <h3>
            Изменить Steam ID
        </h3>

        <p class="modal-description">
            Введи новый Steam ID или код дружбы.
        </p>

        <input
            id="newSteamInput"
            class="modal-input"
            type="text"
            placeholder="Введите Steam ID"
            autocomplete="off"
        >

        <div class="modal-buttons">

            <button
                class="btn-cancel"
                onclick="closeModal()"
            >
                Отмена
            </button>

            <button
                id="saveBtn"
                class="btn-save"
                onclick="confirmSteamChange()"
            >
                Сохранить
            </button>

        </div>

    </div>

</div>


<script>

    /* ==========================================
       FIREBASE
    ========================================== */

    const dbBase =
        "https://retro-cup-51db5-default-rtdb.firebaseio.com/";

    const dbUsersUrl =
        dbBase + "users/";


    let currentUser =
        localStorage.getItem("currentUser");


    /* ==========================================
       RETRO CUP LEVEL SYSTEM
       
       Порог PR для каждого уровня:
       
       Level 1 = 1 PR
       Level 2 = 20 PR
       Level 3 = 50 PR
       Level 4 = 100 PR
       Level 5 = 150 PR
       Level 6 = 250 PR
       Level 7 = 400 PR
       Level 8 = 600 PR
       Level 9 = 800 PR
       Level 10 = 1000 PR
    ========================================== */

    const LEVEL_THRESHOLDS = [
        1,
        20,
        50,
        100,
        150,
        250,
        400,
        600,
        800,
        1000
    ];


    /* ==========================================
       ПОЛУЧИТЬ LEVEL ПО PR
    ========================================== */

    function getLevelFromPR(pr) {

        let level = 1;

        for (
            let i = 0;
            i < LEVEL_THRESHOLDS.length;
            i++
        ) {

            if (
                pr >= LEVEL_THRESHOLDS[i]
            ) {

                level = i + 1;

            } else {

                break;
            }
        }

        return level;
    }


    /* ==========================================
       ОБНОВЛЕНИЕ LEVEL НА ЭКРАНЕ
    ========================================== */

    function updateProfileLevel(pr) {

        pr = Number(pr);

        if (
            isNaN(pr) ||
            pr < 1
        ) {
            pr = 1;
        }


        const level =
            getLevelFromPR(pr);


        const circle =
            document.getElementById(
                "profile-level-circle"
            );

        const levelText =
            document.getElementById(
                "profile-level"
            );

        const prText =
            document.getElementById(
                "profile-pr"
            );

        const nextText =
            document.getElementById(
                "level-next-text"
            );

        const progressBar =
            document.getElementById(
                "level-progress-bar"
            );


        /* ------------------------------
           LEVEL
        ------------------------------ */

        levelText.innerText =
            level;


        /* ------------------------------
           PR
        ------------------------------ */

        prText.innerText =
            pr;


        /* ------------------------------
           СМЕНА ЦВЕТА LEVEL
        ------------------------------ */

        circle.className =
            "level-circle level-" + level;


        /* ------------------------------
           LEVEL 10
        ------------------------------ */

        if (level >= 10) {

            nextText.innerText =
                "MAX LEVEL • 1000+ PR";

            progressBar.style.width =
                "100%";

            progressBar.style.background =
                "#ffffff";

            progressBar.style.boxShadow =
                "0 0 15px rgba(255,255,255,0.7)";

            return;
        }


        /* ------------------------------
           СЛЕДУЮЩИЙ LEVEL
        ------------------------------ */

        const currentThreshold =
            LEVEL_THRESHOLDS[level - 1];

        const nextThreshold =
            LEVEL_THRESHOLDS[level];


        const remaining =
            nextThreshold - pr;


        nextText.innerText =
            "До Level " +
            (level + 1) +
            ": " +
            Math.max(remaining, 0) +
            " PR";


        /* ------------------------------
           ПРОГРЕСС
        ------------------------------ */

        const progress =
            (
                (pr - currentThreshold) /
                (nextThreshold - currentThreshold)
            ) * 100;


        const safeProgress =
            Math.max(
                0,
                Math.min(
                    100,
                    progress
                )
            );


        progressBar.style.width =
            safeProgress + "%";


        /* Цвет шкалы */

        const colors = [
            "#777783",
            "#ffffff",
            "#5aa9ff",
            "#48e0ff",
            "#a67cff",
            "#d16cff",
            "#ff5c8a",
            "#ff7a45",
            "#ffd84d"
        ];


        progressBar.style.background =
            colors[level - 1] || "#a67cff";

        progressBar.style.boxShadow =
            "0 0 12px " +
            (colors[level - 1] || "#a67cff");

    }


    /* ==========================================
       ПРОВЕРКА АВТОРИЗАЦИИ
    ========================================== */

    if (!currentUser) {

        window.location.href =
            "auth.html";

    } else {

        document.getElementById(
            "welcome-text"
        ).innerText =
            currentUser;


        loadUserData();

    }


    /* ==========================================
       ПОДСЧЕТ ГЛОБАЛЬНОЙ СТАТИСТИКИ
    ========================================== */

    async function getGlobalStats(playerName) {

        try {

            const response =
                await fetch(
                    dbBase +
                    "tournaments.json"
                );


            const tournaments =
                await response.json();


            let totalKills = 0;

            let totalDeaths = 0;

            let matchesPlayed = 0;

            let matchesWon = 0;


            if (tournaments) {

                Object.values(
                    tournaments
                ).forEach(tourney => {

                    if (tourney.matches) {

                        Object.values(
                            tourney.matches
                        ).forEach(match => {

                            if (
                                match &&
                                (
                                    match.p1 === playerName ||
                                    match.p2 === playerName
                                )
                            ) {

                                let s1 =
                                    parseInt(match.s1);

                                let s2 =
                                    parseInt(match.s2);


                                if (
                                    !isNaN(s1) &&
                                    !isNaN(s2)
                                ) {

                                    matchesPlayed++;


                                    if (
                                        match.winner ===
                                        playerName
                                    ) {

                                        matchesWon++;

                                    }


                                    if (
                                        match.p1 ===
                                        playerName
                                    ) {

                                        totalKills += s1;

                                        totalDeaths += s2;

                                    } else {

                                        totalKills += s2;

                                        totalDeaths += s1;

                                    }

                                }

                            }

                        });

                    }

                });

            }


            let kd =
                totalDeaths === 0
                    ? (
                        totalKills > 0
                            ? totalKills
                            : 0
                    )
                    : (
                        totalKills /
                        totalDeaths
                    );


            let winrate =
                matchesPlayed === 0
                    ? 0
                    : (
                        matchesWon /
                        matchesPlayed
                    ) * 100;


            return {

                kd:
                    kd.toFixed(2),

                winrate:
                    winrate.toFixed(1) + "%",

                matches:
                    matchesPlayed

            };


        } catch (error) {

            console.error(
                "Ошибка загрузки статистики:",
                error
            );


            return {

                kd: "0.00",

                winrate: "0.0%",

                matches: 0

            };

        }

    }


    /* ==========================================
       ЗАГРУЗКА ДАННЫХ ПОЛЬЗОВАТЕЛЯ
    ========================================== */

    async function loadUserData() {

        try {

            const response =
                await fetch(
                    dbUsersUrl +
                    encodeURIComponent(
                        currentUser
                    ) +
                    ".json"
                );


            if (!response.ok) {

                throw new Error(
                    "Ошибка HTTP: " +
                    response.status
                );

            }


            const data =
                await response.json();


            /* ==================================
               STEAM ID
            ================================== */

            const steamElement =
                document.getElementById(
                    "display-steam"
                );


            if (
                data &&
                data.steamCode
            ) {

                steamElement.innerText =
                    data.steamCode;

                steamElement.style.color =
                    "white";

            } else {

                steamElement.innerText =
                    "Не указан";

                steamElement.style.color =
                    "#8c8c9b";

            }


            /* ==================================
               АВАТАР
            ================================== */

            if (
                data &&
                data.avatar
            ) {

                document.getElementById(
                    "profile-avatar"
                ).src =
                    data.avatar;

            }


            /* ==================================
               RETRO CUP PR
               
               Если pr существует —
               используем его.

               Если нет —
               игрок начинает с 1 PR.
            ================================== */

            let playerPR = 1;


            if (
                data &&
                data.pr !== undefined
            ) {

                playerPR =
                    Number(data.pr);


                if (
                    isNaN(playerPR) ||
                    playerPR < 1
                ) {

                    playerPR = 1;

                }

            }


            updateProfileLevel(
                playerPR
            );


            /* ==================================
               ГЛОБАЛЬНАЯ СТАТИСТИКА
            ================================== */

            const stats =
                await getGlobalStats(
                    currentUser
                );


            document.getElementById(
                "stat-kd"
            ).innerText =
                stats.kd;


            document.getElementById(
                "stat-winrate"
            ).innerText =
                stats.winrate;


            document.getElementById(
                "stat-matches"
            ).innerText =
                stats.matches;


        } catch (error) {

            console.error(
                "Ошибка загрузки профиля:",
                error
            );


            document.getElementById(
                "display-steam"
            ).innerText =
                "Ошибка загрузки";


            document.getElementById(
                "stat-kd"
            ).innerText =
                "---";


            document.getElementById(
                "stat-winrate"
            ).innerText =
                "---";


            document.getElementById(
                "stat-matches"
            ).innerText =
                "---";


            /* Даже при ошибке
               уровень остаётся Level 1 */

            updateProfileLevel(1);

        }

    }


    /* ==========================================
       ЗАГРУЗКА АВАТАРКИ
    ========================================== */

    async function uploadAvatar(event) {

        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "Пожалуйста, выберите изображение."
            );


            event.target.value =
                "";


            return;

        }


        if (
            file.size >
            800 * 1024
        ) {

            alert(
                "Файл слишком большой! " +
                "Выберите картинку весом до 800 КБ."
            );


            event.target.value =
                "";


            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            async function(e) {

                const base64Image =
                    e.target.result;


                document.getElementById(
                    "profile-avatar"
                ).src =
                    base64Image;


                try {

                    const response =
                        await fetch(
                            dbUsersUrl +
                            encodeURIComponent(
                                currentUser
                            ) +
                            ".json",
                            {

                                method:
                                    "PATCH",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        avatar:
                                            base64Image

                                    })

                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Ошибка сохранения"
                        );

                    }


                    alert(
                        "Аватарка успешно сохранена!"
                    );


                } catch (error) {

                    console.error(
                        "Ошибка сохранения аватарки:",
                        error
                    );


                    alert(
                        "Ошибка при сохранении аватарки в базу данных!"
                    );

                }

            };


        reader.onerror =
            function() {

                alert(
                    "Не удалось прочитать файл."
                );

            };


        reader.readAsDataURL(file);

    }


    /* ==========================================
       ОТКРЫТИЕ STEAM MODAL
    ========================================== */

    function openModal() {

        const modal =
            document.getElementById(
                "steamModal"
            );


        const input =
            document.getElementById(
                "newSteamInput"
            );


        const currentCode =
            document.getElementById(
                "display-steam"
            ).innerText;


        if (
            currentCode !==
                "⏳ Загрузка..." &&

            currentCode !==
                "Не указан" &&

            currentCode !==
                "Ошибка загрузки"
        ) {

            input.value =
                currentCode;

        } else {

            input.value =
                "";

        }


        modal.style.display =
            "flex";


        setTimeout(
            function() {

                input.focus();

                input.select();

            },
            100
        );

    }


    /* ==========================================
       ЗАКРЫТИЕ MODAL
    ========================================== */

    function closeModal() {

        document.getElementById(
            "steamModal"
        ).style.display =
            "none";

    }


    /* ==========================================
       КЛИК ПО ФОНУ MODAL
    ========================================== */

    function handleModalBackground(event) {

        if (
            event.target.id ===
            "steamModal"
        ) {

            closeModal();

        }

    }


    /* ==========================================
       СОХРАНЕНИЕ STEAM ID
    ========================================== */

    async function confirmSteamChange() {

        const input =
            document.getElementById(
                "newSteamInput"
            );


        const btn =
            document.getElementById(
                "saveBtn"
            );


        const newSteam =
            input.value.trim();


        if (!newSteam) {

            alert(
                "Поле не может быть пустым!"
            );


            input.focus();


            return;

        }


        if (
            newSteam.length < 3
        ) {

            alert(
                "Steam ID слишком короткий."
            );


            input.focus();


            return;

        }


        btn.innerText =
            "Сохранение...";


        btn.disabled =
            true;


        try {

            const response =
                await fetch(
                    dbUsersUrl +
                    encodeURIComponent(
                        currentUser
                    ) +
                    ".json",
                    {

                        method:
                            "PATCH",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                steamCode:
                                    newSteam

                            })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Ошибка HTTP: " +
                    response.status
                );

            }


            const displaySteam =
                document.getElementById(
                    "display-steam"
                );


            displaySteam.innerText =
                newSteam;


            displaySteam.style.color =
                "white";


            closeModal();


        } catch (error) {

            console.error(
                "Ошибка сохранения Steam ID:",
                error
            );


            alert(
                "Ошибка соединения с базой данных!"
            );

        } finally {

            btn.innerText =
                "Сохранить";


            btn.disabled =
                false;

        }

    }


    /* ==========================================
       ENTER / ESCAPE
    ========================================== */

    document
        .getElementById(
            "newSteamInput"
        )
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    confirmSteamChange();

                }


                if (
                    event.key ===
                    "Escape"
                ) {

                    closeModal();

                }

            }
        );


    /* ==========================================
       ВЫХОД
    ========================================== */

    function logout() {

        const confirmed =
            confirm(
                "Ты действительно хочешь выйти?"
            );


        if (!confirmed) {

            return;

        }


        localStorage.removeItem(
            "currentUser"
        );


        window.location.href =
            "index.html";

    }

</script>
