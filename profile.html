
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cup | Мой Профиль</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0e;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Навигация */
        .nav-link {
            color: #8c8c9b;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
            display: inline-block;
            margin-bottom: 20px;
        }

        .nav-link:hover {
            color: #a67cff;
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            font-weight: 900;
        }

        /* Кнопка выхода */
        .logout-btn {
            background: rgba(255, 60, 100, 0.1);
            color: #ff3c64;
            border: 1px solid rgba(255, 60, 100, 0.3);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #ff3c64;
            color: white;
        }

        /* Карточки */
        .profile-card {
            background: #141419;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #1f1f26;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #a67cff;
        }

        .info-row {
            font-size: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .steam-value {
            font-size: 24px;
            font-weight: bold;
            color: white;
            word-break: break-word;
        }

        /* Аватар */
        .avatar-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #25252d;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #a67cff;
            background: #0b0b0e;
            box-shadow: 0 0 25px rgba(166, 124, 255, 0.2);
        }

        .avatar-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .avatar-title {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .avatar-description {
            color: #8c8c9b;
            font-size: 13px;
        }

        .avatar-upload {
            display: inline-block;
            width: max-content;
            background: #23232b;
            border: 1px solid #33333d;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .avatar-upload:hover {
            background: #a67cff;
            border-color: #a67cff;
        }

        .avatar-upload input {
            display: none;
        }

        /* Кнопка изменения Steam */
        .edit-btn {
            background: #a67cff;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 6px;
            width: max-content;
            transition: 0.2s;
        }

        .edit-btn:hover {
            background: #915eff;
            transform: translateY(-2px);
        }

        /* ==========================================
           СТАТИСТИКА (НОВОЕ)
        ========================================== */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #25252d;
            text-align: center;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0c0c10;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #303039;
        }

        .stat-label {
            color: #8c8c9b;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .stat-val {
            color: white;
            font-size: 22px;
            font-weight: 900;
        }

        .stat-val.green {
            color: #00ffcc;
        }

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: #141419;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(166, 124, 255, 0.2);
        }

        .modal-box h3 {
            margin-top: 0;
            color: white;
            font-size: 20px;
        }

        .modal-description {
            color: #8c8c9b;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            margin: 5px 0 15px 0;
            background: #0b0b0e;
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }

        .modal-input:focus {
            outline: none;
            border-color: #a67cff;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-save {
            flex: 1;
            background: #a67cff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-save:hover {
            background: #915eff;
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-cancel {
            flex: 1;
            background: transparent;
            color: #8c8c9b;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cancel:hover {
            background: #23232b;
            color: white;
        }

        /* Адаптив */
        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            header {
                align-items: flex-start;
            }

            h1 {
                font-size: 23px;
            }

            .profile-card {
                padding: 20px;
            }

            .steam-value {
                font-size: 20px;
            }

            .avatar-wrapper {
                align-items: flex-start;
            }

            .profile-avatar {
                width: 75px;
                height: 75px;
            }

            .modal-box {
                padding: 25px 20px;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Навигация -->
    <a href="index.html" class="nav-link">
        ← Вернуться на главную
    </a>

    <!-- Шапка -->
    <header>
        <h1 id="welcome-text">Профиль</h1>

        <button class="logout-btn" onclick="logout()">
            Выйти
        </button>
    </header>


    <!-- Карточка профиля -->
    <div class="profile-card">

        <h2>Мой Аккаунт</h2>

        <!-- Аватар -->
        <div class="avatar-wrapper">

            <img
                id="profile-avatar"
                class="profile-avatar"
                src="https://via.placeholder.com/150/141419/a67cff?text=TU"
                alt="Аватар"
            >

            <div class="avatar-info">

                <div class="avatar-title">
                    Моя аватарка
                </div>

                <div class="avatar-description">
                    JPG, PNG или GIF до 800 КБ
                </div>

                <label class="avatar-upload">
                    Изменить аватарку

                    <input
                        type="file"
                        accept="image/*"
                        onchange="uploadAvatar(event)"
                    >
                </label>

            </div>

        </div>


        <!-- Steam ID -->
        <div class="info-row">

            <span style="color: #8c8c9b; font-size: 14px;">
                Steam ID (Код дружбы):
            </span>

            <span
                id="display-steam"
                class="steam-value"
            >
                ⏳ Загрузка...
            </span>

            <button
                class="edit-btn"
                onclick="openModal()"
            >
                Изменить код
            </button>

        </div>

        <!-- ==========================================
             ГЛОБАЛЬНАЯ СТАТИСТИКА
        ========================================== -->
        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-label">K/D Рейтинг</span>
                <span class="stat-val green" id="stat-kd">⏳...</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Винрейт</span>
                <span class="stat-val" id="stat-winrate">⏳...</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Матчи</span>
                <span class="stat-val" id="stat-matches">⏳...</span>
            </div>
        </div>

    </div>

</div>


<!-- ==========================================
     МОДАЛЬНОЕ ОКНО STEAM ID
========================================== -->

<div
    id="steamModal"
    class="modal-overlay"
    onclick="handleModalBackground(event)"
>

    <div class="modal-box">

        <h3>
            Изменить Steam ID
        </h3>

        <p class="modal-description">
            Введи новый Steam ID или код дружбы.
        </p>

        <input
            id="newSteamInput"
            class="modal-input"
            type="text"
            placeholder="Введите Steam ID"
            autocomplete="off"
        >

        <div class="modal-buttons">

            <button
                class="btn-cancel"
                onclick="closeModal()"
            >
                Отмена
            </button>

            <button
                id="saveBtn"
                class="btn-save"
                onclick="confirmSteamChange()"
            >
                Сохранить
            </button>

        </div>

    </div>

</div>


<script>

    /* ==========================================
       FIREBASE
    ========================================== */

    const dbBase = "https://retro-cup-51db5-default-rtdb.firebaseio.com/";
    const dbUsersUrl = dbBase + "users/";

    let currentUser =
        localStorage.getItem("currentUser");


    /* ==========================================
       ПРОВЕРКА АВТОРИЗАЦИИ
    ========================================== */

    if (!currentUser) {

        window.location.href = "auth.html";

    } else {

        document.getElementById("welcome-text").innerText =
            currentUser;

        loadUserData();
    }


    /* ==========================================
       ПОДСЧЕТ ГЛОБАЛЬНОЙ СТАТИСТИКИ (НОВОЕ)
    ========================================== */
    async function getGlobalStats(playerName) {
        try {
            // Скачиваем все турниры разом
            const response = await fetch(dbBase + "tournaments.json");
            const tournaments = await response.json();

            let totalKills = 0;
            let totalDeaths = 0;
            let matchesPlayed = 0;
            let matchesWon = 0;

            if (tournaments) {
                // Перебираем каждый турнир
                Object.values(tournaments).forEach(tourney => {
                    if (tourney.matches) {
                        // Перебираем каждый матч в турнире
                        Object.values(tourney.matches).forEach(match => {
                            // Если игрок участвовал в матче
                            if (match && (match.p1 === playerName || match.p2 === playerName)) {
                                
                                let s1 = parseInt(match.s1);
                                let s2 = parseInt(match.s2);

                                // Проверяем, что матч был реально сыгран (есть счет)
                                if (!isNaN(s1) && !isNaN(s2)) {
                                    matchesPlayed++;
                                    
                                    if (match.winner === playerName) {
                                        matchesWon++;
                                    }

                                    // Суммируем фраги и смерти
                                    if (match.p1 === playerName) {
                                        totalKills += s1;
                                        totalDeaths += s2;
                                    } else {
                                        totalKills += s2;
                                        totalDeaths += s1;
                                    }
                                }
                            }
                        });
                    }
                });
            }

            let kd = totalDeaths === 0 ? (totalKills > 0 ? totalKills : 0) : (totalKills / totalDeaths);
            let winrate = matchesPlayed === 0 ? 0 : (matchesWon / matchesPlayed) * 100;

            return {
                kd: kd.toFixed(2),
                winrate: winrate.toFixed(1) + "%",
                matches: matchesPlayed
            };

        } catch (error) {
            console.error("Ошибка загрузки статистики:", error);
            return { kd: "0.00", winrate: "0.0%", matches: 0 };
        }
    }


    /* ==========================================
       ЗАГРУЗКА ДАННЫХ ПОЛЬЗОВАТЕЛЯ И СТАТИСТИКИ
    ========================================== */

    async function loadUserData() {

        try {

            const response =
                await fetch(
                    dbUsersUrl +
                    encodeURIComponent(currentUser) +
                    ".json"
                );

            if (!response.ok) {
                throw new Error(
                    "Ошибка HTTP: " + response.status
                );
            }

            const data =
                await response.json();


            /* -------------------------------
               Steam ID
            -------------------------------- */

            const steamElement =
                document.getElementById("display-steam");

            if (data && data.steamCode) {

                steamElement.innerText =
                    data.steamCode;

                steamElement.style.color =
                    "white";

            } else {

                steamElement.innerText =
                    "Не указан";

                steamElement.style.color =
                    "#8c8c9b";
            }


            /* -------------------------------
               Аватар
            -------------------------------- */

            if (data && data.avatar) {

                document.getElementById(
                    "profile-avatar"
                ).src = data.avatar;

            }
            
            /* -------------------------------
               ГЛОБАЛЬНАЯ СТАТИСТИКА (НОВОЕ)
            -------------------------------- */
            
            const stats = await getGlobalStats(currentUser);
            
            document.getElementById("stat-kd").innerText = stats.kd;
            document.getElementById("stat-winrate").innerText = stats.winrate;
            document.getElementById("stat-matches").innerText = stats.matches;


        } catch (error) {

            console.error(
                "Ошибка загрузки профиля:",
                error
            );

            document.getElementById(
                "display-steam"
            ).innerText = "Ошибка загрузки";
            
            document.getElementById("stat-kd").innerText = "---";
            document.getElementById("stat-winrate").innerText = "---";
            document.getElementById("stat-matches").innerText = "---";

        }
    }


    /* ==========================================
       ЗАГРУЗКА АВАТАРКИ
    ========================================== */

    async function uploadAvatar(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        /* Проверка типа файла */

        if (!file.type.startsWith("image/")) {

            alert(
                "Пожалуйста, выберите изображение."
            );

            event.target.value = "";

            return;
        }


        /* Ограничение размера */

        if (file.size > 800 * 1024) {

            alert(
                "Файл слишком большой! " +
                "Выберите картинку весом до 800 КБ."
            );

            event.target.value = "";

            return;
        }


        const reader =
            new FileReader();


        reader.onload = async function(e) {

            const base64Image =
                e.target.result;


            /* Сразу показываем аватар */

            document.getElementById(
                "profile-avatar"
            ).src = base64Image;


            try {

                const response =
                    await fetch(
                        dbUsersUrl +
                        encodeURIComponent(currentUser) +
                        ".json",
                        {
                            method: "PATCH",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                avatar: base64Image
                            })
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        "Ошибка сохранения"
                    );
                }


                alert(
                    "Аватарка успешно сохранена!"
                );

            } catch (error) {

                console.error(
                    "Ошибка сохранения аватарки:",
                    error
                );

                alert(
                    "Ошибка при сохранении аватарки в базу данных!"
                );

            }

        };


        reader.onerror = function() {

            alert(
                "Не удалось прочитать файл."
            );

        };


        reader.readAsDataURL(file);
    }


    /* ==========================================
       ОТКРЫТИЕ МОДАЛЬНОГО ОКНА
    ========================================== */

    function openModal() {

        const modal =
            document.getElementById(
                "steamModal"
            );

        const input =
            document.getElementById(
                "newSteamInput"
            );


        /* Получаем текущий Steam ID */

        const currentCode =
            document.getElementById(
                "display-steam"
            ).innerText;


        if (
            currentCode !== "⏳ Загрузка..." &&
            currentCode !== "Не указан" &&
            currentCode !== "Ошибка загрузки"
        ) {

            input.value =
                currentCode;

        } else {

            input.value = "";

        }


        modal.style.display =
            "flex";


        /* Фокус на поле */

        setTimeout(function() {

            input.focus();

            input.select();

        }, 100);
    }


    /* ==========================================
       ЗАКРЫТИЕ МОДАЛЬНОГО ОКНА
    ========================================== */

    function closeModal() {

        document.getElementById(
            "steamModal"
        ).style.display = "none";
    }


    /* ==========================================
       ЗАКРЫТИЕ ПРИ КЛИКЕ НА ФОН
    ========================================== */

    function handleModalBackground(event) {

        if (
            event.target.id === "steamModal"
        ) {

            closeModal();
        }
    }


    /* ==========================================
       СОХРАНЕНИЕ STEAM ID
    ========================================== */

    async function confirmSteamChange() {

        const input =
            document.getElementById(
                "newSteamInput"
            );

        const btn =
            document.getElementById(
                "saveBtn"
            );


        const newSteam =
            input.value.trim();


        /* Проверка */

        if (!newSteam) {

            alert(
                "Поле не может быть пустым!"
            );

            input.focus();

            return;
        }


        if (newSteam.length < 3) {

            alert(
                "Steam ID слишком короткий."
            );

            input.focus();

            return;
        }


        /* Блокируем кнопку */

        btn.innerText =
            "Сохранение...";

        btn.disabled = true;


        try {

            const response =
                await fetch(
                    dbUsersUrl +
                    encodeURIComponent(currentUser) +
                    ".json",
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            steamCode: newSteam
                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Ошибка HTTP: " +
                    response.status
                );
            }


            /* Обновляем значение на странице */

            const displaySteam =
                document.getElementById(
                    "display-steam"
                );

            displaySteam.innerText =
                newSteam;

            displaySteam.style.color =
                "white";


            /* Закрываем окно */

            closeModal();


        } catch (error) {

            console.error(
                "Ошибка сохранения Steam ID:",
                error
            );

            alert(
                "❌ Ошибка соединения с базы данных!"
            );

        } finally {

            btn.innerText =
                "Сохранить";

            btn.disabled = false;
        }
    }


    /* ==========================================
       ENTER В ПОЛЕ STEAM ID
    ========================================== */

    document
        .getElementById("newSteamInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    confirmSteamChange();
                }

                if (event.key === "Escape") {

                    closeModal();
                }
            }
        );


    /* ==========================================
       ВЫХОД
    ========================================== */

    function logout() {

        const confirmed =
            confirm(
                "Ты действительно хочешь выйти?"
            );


        if (!confirmed) {
            return;
        }


        localStorage.removeItem(
            "currentUser"
        );


        window.location.href =
            "index.html";
    }

</script>

</body>
</html>
